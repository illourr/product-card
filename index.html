<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Product Card</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #eef0f3;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: #111;
  }

  .card {
    width: 300px;
    background: #fff;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .card:hover {
    transform: translateY(-4px);
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.12);
  }

  .card-media {
    position: relative;
    aspect-ratio: 4 / 3;
    background: linear-gradient(135deg, #2b2f36, #121418);
    display: grid;
    place-items: center;
  }
  .card-media svg { width: 45%; opacity: 0.9; }

  /* Reflective badge */
  .badge {
    position: absolute;
    top: 12px;
    left: 12px;
    padding: 6px 12px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #1d1f23;
    background: linear-gradient(
      135deg,
      #c9ccd1 0%,
      #ffffff 22%,
      #9ea3aa 45%,
      #f4f5f7 62%,
      #b3b7bd 100%
    );
    border: 1px solid rgba(255, 255, 255, 0.7);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.9),
      inset 0 -1px 0 rgba(0, 0, 0, 0.15),
      0 2px 8px rgba(0, 0, 0, 0.35);
    overflow: hidden;
    isolation: isolate;
  }
  /* Moving light sweep */
  .badge::after {
    content: "";
    position: absolute;
    inset: -50% auto -50% -60%;
    width: 40%;
    background: linear-gradient(
      100deg,
      transparent 0%,
      rgba(255, 255, 255, 0.95) 50%,
      transparent 100%
    );
    transform: skewX(-20deg);
    animation: sheen 2.8s ease-in-out infinite;
    z-index: -1;
  }
  @keyframes sheen {
    0%   { left: -60%; }
    60%  { left: 130%; }
    100% { left: 130%; }
  }
  @media (prefers-reduced-motion: reduce) {
    .badge::after { animation: none; display: none; }
  }

  .card-body { padding: 18px 20px 20px; }
  .card-title { font-size: 18px; font-weight: 650; margin-bottom: 4px; }
  .card-desc  { font-size: 14px; color: #666; line-height: 1.45; margin-bottom: 16px; }

  .card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .price { font-size: 20px; font-weight: 700; }

  .btn {
    border: 0;
    padding: 10px 16px;
    border-radius: 10px;
    background: #111;
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .btn:hover { background: #333; }
</style>
</head>
<body>

  <article class="card">
    <div class="card-media">
      <span class="badge">Reflective</span>
      <!-- Placeholder product image -->
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M20.4 14.5 16 10 4 20"/>
        <rect x="3" y="3" width="18" height="18" rx="2"/>
        <circle cx="9" cy="9" r="2"/>
      </svg>
    </div>

    <div class="card-body">
      <h2 class="card-title">Night Runner Jacket</h2>
      <p class="card-desc">Lightweight shell with high-visibility reflective trim for low-light runs.</p>
      <div class="card-footer">
        <span class="price">$89</span>
        <button class="btn" type="button">Add to cart</button>
      </div>
    </div>
  </article>

</body>
</html>
